<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fundo Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a presenter guide on the left, one working phone on the right. Under 900px the guide hides; under 520px the phone fills the screen. */
:root{
  --salmon:#FF8A6B; --salmon2:#FF9C82; --salmon3:#FFB09A; --coral:#C2452A; --blush:#FFE2D6; --cream:#FFF6F1;
  --ink:#26191C; --sun:#FFD66B; --line:#F3E3DB; --muted:#6F5A57; --card:#FFFFFF;
  --stage:#FBEEE7; --stage-ink:#26191C; --stage-muted:#6F5A57; --panel:#FFFFFF; --panel-line:#F0DDD4; --panel-hover:#FFF6F1;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#1D1315;--stage-ink:#FFF6F1;--stage-muted:#CDB8B1;--panel:#2A1D20;--panel-line:#3C2B2F;--panel-hover:#33242817;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#1D1315;--stage-ink:#FFF6F1;--stage-muted:#CDB8B1;--panel:#2A1D20;--panel-line:#3C2B2F;--panel-hover:#33242817;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--stage-ink);font-family:var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:64px;padding-block:20px}
.guide{width:340px;flex-shrink:0;min-width:0}
.g-brand{display:flex;align-items:center;gap:12px}
.g-brand b{font:800 30px/1 var(--display);letter-spacing:-.04em}
.g-brand span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--salmon);color:#26191C}
.guide h1{font:800 34px/1.05 var(--display);letter-spacing:-.03em;margin:22px 0 10px;text-wrap:balance}
.guide p{margin:0;color:var(--stage-muted);font-size:15px;line-height:1.5}
.flows{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.gi{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--panel-line);cursor:pointer;transition:transform .15s,border-color .2s}
.gi:hover{border-color:var(--salmon);transform:translateX(3px)}
.gi .gt{width:36px;height:36px;border-radius:12px;background:var(--blush);color:var(--coral);display:grid;place-items:center;flex-shrink:0}
.gi b{display:block;font-size:15px}
.gi small{display:block;font-size:13px;color:var(--stage-muted);margin-top:1px}
.g-ctl{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.g-btn{height:44px;padding:0 18px;border-radius:99px;border:1.5px solid var(--stage-ink);background:transparent;font-weight:700;font-size:14px;cursor:pointer}
.g-btn:hover{background:var(--salmon);border-color:var(--salmon);color:#26191C}
.g-tog{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.g-tog input{width:20px;height:20px;accent-color:#C2452A}
.phone-wrap{position:relative;flex-shrink:0;margin:12px}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;border-radius:46px;overflow:hidden;overflow:clip;background:var(--cream);color:var(--ink);box-shadow:0 0 0 10px #26191C,0 50px 90px -30px rgba(38,25,28,.6);isolation:isolate;font-family:var(--body)}
body.mobile .phone{border-radius:0;box-shadow:none}
body.mobile .phone-wrap{margin:0}
body.mobile .stage{padding:0;gap:0;align-items:flex-start;background:#FFF6F1}
body.mobile{background:#FFF6F1;padding-left:0;padding-right:0}
@media (max-width:900px){.guide{display:none}}

/* ---------- phone internals ---------- */
.screen{position:absolute;inset:0;background:var(--cream);overflow:hidden;overflow:clip;transition:transform .5s cubic-bezier(.22,.9,.28,1),opacity .4s ease,visibility 0s}
.screen:not([data-s=active]){visibility:hidden;transition:transform .5s cubic-bezier(.22,.9,.28,1),opacity .4s ease,visibility 0s .5s}
.screen[data-s=right]{transform:translateX(100%)}
.screen[data-s=behind]{transform:translateX(-22%);opacity:0}
.screen[data-s=rise]{transform:translateY(16px);opacity:0}
.screen[data-s=hidden]{opacity:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:24px 24px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.h{font-family:var(--display);font-weight:800;letter-spacing:-.03em}
.mut{color:var(--muted)}
.rise{animation:rise .6s cubic-bezier(.22,.9,.28,1) both;animation-delay:calc(var(--i,0)*55ms + 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,18px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:18px;font:700 17px var(--body);cursor:pointer;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.85;cursor:default}
.btn.dark{background:var(--ink);color:var(--cream);box-shadow:0 16px 28px -12px rgba(38,25,28,.65)}
.btn.salmon{background:var(--salmon);color:var(--ink);box-shadow:0 16px 28px -12px rgba(255,138,107,.9)}
.btn.ghost{background:transparent;border:2px solid var(--ink);color:var(--ink)}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:inline-block}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 1px 2px rgba(38,25,28,.05),0 12px 28px -12px rgba(194,69,42,.18)}
.tile{flex-shrink:0;width:44px;height:44px;border-radius:14px;background:var(--blush);color:var(--coral);display:grid;place-items:center}
.top{display:flex;align-items:center;gap:14px}
.t28{font-size:28px;margin:0}
.rb{width:48px;height:48px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(38,25,28,.05),0 12px 28px -12px rgba(194,69,42,.18);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .12s}
.rb:active{transform:scale(.94)}
.sec{font:700 20px var(--display);letter-spacing:-.02em;margin:0}
.lbl{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.in{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font:500 16px var(--body);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.in::placeholder{color:#7E6A66}
.in:focus{outline:none;border-color:var(--salmon);box-shadow:0 0 0 4px var(--blush)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:14px;font-weight:600}
.sw{position:relative;width:56px;height:44px;flex-shrink:0;background:none;border:0;padding:0;cursor:pointer}
.sw::before{content:"";position:absolute;left:0;top:7px;width:56px;height:30px;border-radius:99px;background:#D9C4BB;transition:background .3s}
.sw i{position:absolute;left:4px;top:11px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .3s}
.sw.on::before{background:var(--ink)}
.sw.on i{transform:translateX(26px);background:var(--salmon)}
.cta{position:absolute;left:24px;right:24px;bottom:28px;z-index:5}

/* tab bar */
.tabbar{position:absolute;left:16px;right:16px;bottom:20px;height:68px;padding:8px;border-radius:28px;background:#fff;display:flex;z-index:20;box-shadow:0 14px 34px -10px rgba(38,25,28,.25),0 0 0 1px var(--line);transition:transform .5s cubic-bezier(.22,.9,.28,1)}
.tabbar.off{transform:translateY(140%)}
.tab-pill{position:absolute;top:8px;left:8px;width:calc((100% - 16px)/4);height:calc(100% - 16px);border-radius:20px;background:var(--salmon);transform:translateX(calc(var(--ti,0)*100%));transition:transform .45s cubic-bezier(.3,1.2,.5,1)}
.tab{position:relative;z-index:1;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 11.5px var(--body);color:var(--muted);cursor:pointer;transition:color .2s}
.tab.on{color:var(--ink);font-weight:700}
.tab .ti{position:relative}
.dotb{position:absolute;top:-2px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--coral);border:2px solid #fff}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(38,25,28,.45);opacity:0;pointer-events:none;transition:opacity .35s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;background:#fff;border-radius:32px 32px 0 0;padding:12px 24px 32px;transform:translateY(105%);transition:transform .5s cubic-bezier(.22,.9,.28,1);box-shadow:0 -20px 50px -20px rgba(38,25,28,.35);max-height:88%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#E8D5CC;margin:0 auto 18px}
.toast{position:absolute;left:24px;right:24px;bottom:104px;z-index:60;background:var(--ink);color:var(--cream);border-radius:18px;padding:14px 16px;font:600 14px/1.35 var(--body);display:flex;gap:10px;align-items:center;transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.22,.9,.28,1),opacity .3s;box-shadow:0 18px 30px -14px rgba(38,25,28,.6)}
.toast.on{transform:none;opacity:1}
.toast svg{flex-shrink:0;color:var(--salmon)}
.banner{position:absolute;left:12px;right:12px;top:12px;z-index:70;display:flex;gap:12px;align-items:center;text-align:left;border:0;background:rgba(255,255,255,.97);border-radius:22px;padding:12px 14px;box-shadow:0 20px 40px -16px rgba(38,25,28,.4),0 0 0 1px var(--line);transform:translateY(-150%);transition:transform .55s cubic-bezier(.3,1.2,.5,1);cursor:pointer;color:var(--ink)}
.banner.on{transform:none}
.banner b{display:block;font-size:14px}
.banner small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.banner .app{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--coral)}

/* hero cards */
.hero{position:relative;overflow:hidden;isolation:isolate;border-radius:28px;background:var(--salmon);padding:22px;box-shadow:0 22px 40px -18px rgba(194,69,42,.55)}
.hero .r1{position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--salmon2);z-index:-1;animation:drift 9s ease-in-out infinite}
.hero .r2{position:absolute;right:8px;top:8px;width:64px;height:64px;border-radius:50%;background:var(--salmon3);z-index:-1}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--blush);font-size:13px;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font:600 12px var(--body);color:var(--ink);cursor:pointer;padding:0}
.qa .qi{width:60px;height:60px;border-radius:20px;background:#fff;color:var(--coral);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 1px 2px rgba(38,25,28,.05),0 12px 28px -12px rgba(194,69,42,.18);transition:transform .15s}
.qa button:active .qi{transform:scale(.92)}
.qa .prim .qi{background:var(--salmon);color:var(--ink);border-color:var(--salmon);box-shadow:0 12px 24px -10px rgba(255,138,107,.8)}
.ln{padding:14px 16px;border-radius:20px}
.ln .a{display:flex;justify-content:space-between;gap:10px}
.ln b{display:block;font-size:16px}
.ln small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tr{margin-top:12px;height:8px;border-radius:99px;background:var(--blush)}
.tr i{display:block;height:8px;width:0;border-radius:99px;background:var(--salmon);transition:width 1.1s cubic-bezier(.22,.9,.28,1)}

/* lists */
.row{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:20px;text-align:left;cursor:pointer;border:1px solid var(--line);background:#fff;box-shadow:0 1px 2px rgba(38,25,28,.05),0 12px 28px -12px rgba(194,69,42,.14);transition:transform .15s}
.row:active{transform:scale(.98)}
.row .rm{flex:1;min-width:0}
.row b{display:block;font-size:15px}
.row small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.row .rv{text-align:right}
.row .rv small{font-size:12px}
.chips{display:flex;gap:8px}
.chip{height:44px;padding:0 20px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font:700 15px var(--body);cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}

/* payment options */
.opt{width:100%;display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 14px;border-radius:18px;border:2px solid var(--line);background:#fff;text-align:left;cursor:pointer;transition:border-color .25s,background .25s,transform .12s}
.opt:active{transform:scale(.98)}
.opt .tile{width:40px;height:40px;border-radius:12px}
.opt b{flex:1;font-size:16px}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid #D9C4BB;background:#fff;transition:all .3s cubic-bezier(.3,1.4,.5,1)}
.opt.sel{border-color:var(--ink);background:#FFEFE8}
.opt.sel .dot{border-color:var(--ink);background:var(--salmon);box-shadow:inset 0 0 0 4px #FFEFE8}

/* fingerprint */
.fp{position:relative;width:168px;height:168px;border-radius:50%;border:0;padding:0;background:var(--blush);box-shadow:0 0 0 16px #FFEBE2,0 0 0 34px #FFF0E9;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.fp .core{position:absolute;inset:14px;border-radius:50%;background:var(--salmon);transition:background .4s,transform .4s;animation:breathe 2.8s ease-in-out infinite}
.fp .ficon{position:relative;display:grid;place-items:center}
.fp::before,.fp::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--salmon);opacity:0}
.fp.scanning::before{animation:ripple 1.2s ease-out infinite}
.fp.scanning::after{animation:ripple 1.2s ease-out .5s infinite}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.fp .scan{position:absolute;left:38px;right:38px;top:44px;height:3px;border-radius:3px;background:var(--ink);opacity:0}
.fp.scanning .scan{opacity:.85;animation:scan 1s ease-in-out infinite alternate}
@keyframes scan{from{top:44px}to{top:118px}}
.fp.done .core{background:var(--ink);animation:none;transform:scale(1.02)}
.fp.done{color:var(--cream)}
.fp.done .ficon{animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* splash */
.splash{background:var(--salmon)!important;display:grid;place-items:center}
.splash .lw{display:flex;flex-direction:column;align-items:center;gap:22px}
.splash svg rect,.splash svg circle{transform-box:fill-box}
.splash .lt{transform-origin:50% 50%;animation:lpop .55s cubic-bezier(.3,1.3,.5,1) both}
.splash .l1{transform-origin:50% 0;animation:gy .5s .35s cubic-bezier(.22,.9,.28,1) both}
.splash .l2{transform-origin:0 50%;animation:gx .45s .7s cubic-bezier(.22,.9,.28,1) both}
.splash .l3{transform-origin:0 50%;animation:gx .4s .9s cubic-bezier(.22,.9,.28,1) both}
.splash .l4{transform-origin:50% 100%;animation:drop .8s 1.15s both}
.splash .wm{font:800 64px/1 var(--display);letter-spacing:-.05em;animation:rise .7s 1.5s both}
.splash .sub{font-weight:600;font-size:16px;animation:rise .7s 1.75s both}
@keyframes lpop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes drop{0%{transform:translateY(-44px);opacity:0}55%{transform:translateY(0);opacity:1}72%{transform:translateY(-7px)}100%{transform:none;opacity:1}}

/* welcome */
.wl{background:var(--salmon)!important}
.wl .c1{position:absolute;right:-110px;top:-90px;width:340px;height:340px;border-radius:50%;background:var(--salmon2);animation:drift 10s ease-in-out infinite}
.wl .c2{position:absolute;left:-130px;top:330px;width:260px;height:260px;border-radius:50%;background:var(--salmon2);animation:drift 12s ease-in-out infinite reverse}

/* success */
.ok{background:var(--salmon)!important}
.burst{position:absolute;left:50%;top:170px;width:0;height:0;z-index:3;pointer-events:none}
.burst i{position:absolute;left:0;top:0;opacity:0;animation:fly 1.3s cubic-bezier(.15,.8,.3,1) both}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.okc{position:relative;width:104px;height:104px;border-radius:50%;background:var(--ink);color:var(--salmon);display:grid;place-items:center;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both;box-shadow:0 0 0 14px rgba(255,246,241,.35),0 0 0 30px rgba(255,246,241,.18)}
.rcp{border-radius:26px;background:#fff;padding:6px 18px;color:var(--ink);box-shadow:0 24px 40px -22px rgba(38,25,28,.5)}
.rcp div{display:flex;justify-content:space-between;gap:14px;align-items:center;min-height:50px;font-size:14px}
.rcp div+div{border-top:1px solid var(--line)}
.rcp span{color:var(--muted)}
.rcp b{text-align:right}

/* otp */
.otp{display:flex;gap:8px;margin:18px 0 14px}
.otp span{flex:1;height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--cream);display:grid;place-items:center;font:800 24px var(--display)}
.otp span.f{border-color:var(--ink);background:#fff;animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.otpst{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;min-height:28px;color:var(--muted)}
.otpst svg{color:var(--coral)}

/* previews */
.sms{background:#F0F0F2;border-radius:22px;padding:16px;margin:16px 0 18px}
.sms small{display:block;text-align:center;color:#5C5C63;font-size:12px;margin-bottom:10px}
.sms p{margin:0;background:#fff;color:#1d1d20;border-radius:18px 18px 18px 6px;padding:12px 14px;font-size:15px;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.08);animation:rise .5s .2s both}
.ev{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;background:var(--cream);border:1px solid var(--line);margin:16px 0 18px}
.ev .dt{width:52px;flex-shrink:0;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:center;overflow:hidden}
.ev .dt i{display:block;background:var(--coral);color:#fff;font:700 10px var(--body);font-style:normal;letter-spacing:.08em;padding:3px 0}
.ev .dt b{display:block;font:800 22px/1.6 var(--display)}
.ev strong{display:block;font-size:16px}
.ev small{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.krow{display:flex;justify-content:space-between;gap:14px;min-height:48px;align-items:center;font-size:14px;border-top:1px solid var(--line)}
.krow span{color:var(--muted)}
.krow b{text-align:right}

/* hints */
.hints-on [data-hint]{position:relative}
.hints-on [data-hint]::after{content:"";position:absolute;inset:-7px;border-radius:inherit;border:3px solid var(--coral);pointer-events:none;animation:hint 1.5s ease-out infinite;z-index:9}
.hints-on .fp[data-hint]::after{inset:-40px;border-radius:50%}
