<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fundo Home Variants</title>
<style>
/* ---------- shared tokens: identical to index.html ---------- */
:root{
  --salmon:#CDEB5B; --coral:#4C6A0C; --blush:#EAF5C8; --cream:#F7FAEE;
  --ink:#191C15; --sun:#FFD66B; --line:#E2E9D0; --muted:#5A6352; --card:#FFFFFF;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,system-ui,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#ECEFE3;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrapc{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px 96px}
.phone-wrap{position:relative;flex-shrink:0}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;border-radius:46px;overflow:hidden;background:var(--cream);box-shadow:0 0 0 10px #0E100C,0 0 0 11px #3A3F36,0 40px 80px -40px rgba(25,28,21,.45);isolation:isolate}
.sbar{position:absolute;inset:0 0 auto;height:50px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font:600 15px var(--body);background:var(--cream)}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#0A0B09;z-index:41}
#stage{position:absolute;inset:50px 0 0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px 24px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabbar{position:absolute;inset:auto 0 0;padding:6px 8px 26px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}
.tab{flex:1;height:50px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11px var(--body);color:var(--muted)}
.tab.on{color:var(--ink);font-weight:600}.tab.on svg{color:var(--coral)}
.toast{position:absolute;left:24px;right:24px;bottom:100px;z-index:60;background:var(--ink);color:var(--cream);border-radius:14px;padding:13px 16px;font:500 14px/1.35 var(--body);display:flex;gap:10px;align-items:center;transform:translateY(8px);opacity:0;pointer-events:none;transition:transform .25s var(--ease-out),opacity .2s ease}
.toast.on{transform:none;opacity:1}
.toast svg{color:var(--salmon);flex-shrink:0}

/* shared atoms */
.h{font-family:var(--display);font-weight:700;letter-spacing:-.022em;font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.cb{display:inline-grid;place-items:center;flex-shrink:0;border-radius:30%;background:var(--salmon);color:#191C15;font-weight:700;line-height:1;box-shadow:inset 0 0 0 1px rgba(25,28,21,.18)}
.icb{position:relative;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;transition:transform .12s var(--ease-out)}
.icb:active{transform:scale(.95)}
.icb i{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid var(--card)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:14px;font:600 16px var(--body);cursor:pointer;transition:transform .12s var(--ease-out),opacity .2s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.75;cursor:default}
.btn.dark{background:var(--ink);color:var(--cream)}
.btn.lime{background:var(--salmon);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--ink)}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes swap{from{opacity:0;filter:blur(4px);transform:translateY(4px)}}
.in{animation:rise .4s var(--ease-out) both;animation-delay:calc(var(--i,0)*50ms)}
.swap{animation:swap .3s var(--ease-out) both}

/* =========================================================
   1 · LEDGER — statement layout, dense grouped lists
   ========================================================= */
.lg-top{display:flex;align-items:center;justify-content:space-between}
.lg-co{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.lg-head{margin-top:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.lg-lbl{margin:0;font-size:13px;font-weight:500;color:var(--muted)}
.lg-amt{margin-top:6px;font:700 44px/1.05 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline}
.lg-sub{margin:8px 0 18px;font-size:14px;color:var(--muted)}
.odo{display:inline-flex}
.od{display:inline-block;height:1.05em;overflow:hidden}
.ods{display:flex;flex-direction:column;transition:transform .45s var(--ease-io)}
.ods span{height:1.05em;line-height:1.05em}
.lg-sec{margin:26px 0 8px;font:600 15px var(--body)}
.group{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px}
.lg-row{display:flex;align-items:center;gap:12px;min-height:64px;border-top:1px solid var(--line);transition:opacity .3s ease}
.lg-row:first-child{border-top:0}
.lg-row .rm{flex:1;min-width:0}
.lg-row b{display:block;font-size:15px;font-weight:600}
.lg-row small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.lg-row .rv{text-align:right;font-variant-numeric:tabular-nums}
.lg-date{width:40px;flex-shrink:0;text-align:center;border-radius:10px;background:var(--cream);border:1px solid var(--line);overflow:hidden}
.lg-date i{display:block;font:600 9.5px var(--body);font-style:normal;letter-spacing:.04em;color:var(--muted);padding-top:4px}
.lg-date b{font:700 17px/1.3 var(--display);font-variant-numeric:tabular-nums}
.lg-amtc{position:relative;display:inline-block}
.lg-amtc::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease-out)}
.lg-row.paid .lg-amtc::after{transform:scaleX(1)}
.lg-row.paid{opacity:.55}
.lg-pay{height:30px;padding:0 12px;border-radius:99px;border:0;background:var(--salmon);font:600 13px var(--body);cursor:pointer;transition:transform .12s var(--ease-out)}
.lg-pay:active{transform:scale(.95)}
.lg-done{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--coral)}
.tile{width:36px;height:36px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;background:var(--blush);color:var(--coral)}
.bar{margin-top:7px;height:4px;border-radius:9px;background:var(--blush);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--coral);transform-origin:left;transition:transform .5s var(--ease-io)}

/* =========================================================
   2 · WALLET — a stack of physical cards you flick through
   ========================================================= */
.wl-top{display:flex;align-items:center;justify-content:space-between}
.wl-top small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.wl-stack{position:relative;height:236px;margin-top:22px;touch-action:pan-y}
.wl-card{position:absolute;inset:0 0 auto;height:206px;border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;transform-origin:50% 0;transition:transform .4s var(--ease-drawer),opacity .3s ease;user-select:none;-webkit-user-select:none;cursor:grab;will-change:transform}
.wl-card.drag{transition:none;cursor:grabbing}
.wl-card .k{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600}
.wl-card .chip{padding:4px 9px;border-radius:8px;background:rgba(25,28,21,.1);font-size:12px}
.wl-card .amt{margin-top:auto;font:700 38px/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wl-card .lbl{font-size:14px;font-weight:500;opacity:.75;margin-top:6px}
.wl-card .act{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.wl-card .act small{font-size:12.5px;opacity:.7}
.wl-card .act .btn{width:auto;height:40px;padding:0 18px;border-radius:12px;font-size:14.5px}
.wl-card.due{background:var(--salmon);color:var(--ink)}
.wl-card.due2{background:var(--sun);color:var(--ink)}
.wl-card.sav{background:var(--ink);color:var(--cream)}
.wl-card.sav .amt{color:var(--salmon)}
.wl-card.sav .chip{background:rgba(247,250,238,.12)}
.wl-card.sc{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.wl-stamp{position:absolute;right:18px;top:50px;width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--salmon);display:grid;place-items:center;animation:pop .25s var(--ease-out) both}
.wl-card.gone{transition:transform .35s var(--ease-out),opacity .25s ease;opacity:0}
.wl-dots{display:flex;justify-content:center;gap:6px;margin-top:2px}
.wl-dots i{width:6px;height:6px;border-radius:9px;background:#CDD5BE;transition:background-color .2s ease,transform .2s var(--ease-out)}
.wl-dots i.on{background:var(--ink);transform:scale(1.25)}
.wl-hint{text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0}
.wl-qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.wl-qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font:500 12px var(--body);cursor:pointer;padding:0}
.wl-qa span{width:54px;height:54px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--coral);transition:transform .12s var(--ease-out)}
.wl-qa button:active span{transform:scale(.95)}
.wl-loans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.wl-loan{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.wl-loan svg{display:block}
.wl-loan .ring{transition:stroke-dashoffset .6s var(--ease-io)}
.wl-loan b{display:block;font-size:14px;font-weight:600;margin-top:10px}
.wl-loan small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.wl-sec{margin:26px 0 0;font:600 15px var(--body)}
.ringc{position:relative;width:56px;height:56px}
.ringc span{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--display);font-variant-numeric:tabular-nums}

/* =========================================================
   3 · COUNTDOWN — the screen is organised around days
   ========================================================= */
.cd-top{display:flex;align-items:flex-start;justify-content:space-between}
.cd-top small{display:block;font-size:13px;color:var(--muted)}
.cd-hero{margin-top:18px;border-radius:24px;background:var(--salmon);padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cd-ring{position:relative;width:196px;height:196px}
.cd-ring svg{transform:rotate(-90deg)}
.cd-ring .prog{transition:stroke-dashoffset .5s var(--ease-io)}
.cd-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-num{font:700 64px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cd-num.small{font-size:24px;letter-spacing:-.025em}
.cd-unit{font-size:13.5px;font-weight:600;margin-top:4px;opacity:.75}
.cd-check{width:72px;height:72px;border-radius:50%;background:var(--ink);color:var(--salmon);display:grid;place-items:center;animation:pop .25s var(--ease-out) both}
.cd-what{margin:16px 0 0;font-size:15px;font-weight:600}
.cd-hero .btn{margin-top:16px}
.cd-sec{margin:26px 0 10px;font:600 15px var(--body)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--line)}
.tl li{position:relative;display:flex;align-items:center;gap:14px;padding:4px 0}
.tl .dot{position:relative;z-index:1;width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--cream);border:2px solid var(--line);display:grid;place-items:center;color:var(--cream);transition:background-color .25s ease,border-color .25s ease}
.tl .now .dot{background:var(--ink);border-color:var(--ink)}
.tl .ok .dot{background:var(--coral);border-color:var(--coral)}
.tl .item{flex:1;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:14px;border:1px solid transparent;background:none;text-align:left;cursor:default;transition:background-color .2s ease,border-color .2s ease}
.tl button.item{cursor:pointer}
.tl button.item:active{transform:scale(.98)}
.tl .item.sel{background:var(--card);border-color:var(--ink)}
.tl .item .rm{flex:1;min-width:0}
.tl .item b{display:block;font-size:14.5px;font-weight:600}
.tl .item small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.tl .item .rv{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums}
.tl .past .item,.tl .later .item{opacity:.55}
.tl .ok .item{opacity:.6}
.tl .ok .rv{text-decoration:line-through}
.cd-bal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd-bal div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.cd-bal small{display:block;font-size:12.5px;color:var(--muted)}
.cd-bal b{display:block;margin-top:4px;font:700 18px var(--display);font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  *:not(.spin),*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}
  .wl-card,.ods,.bar i,.cd-ring .prog,.wl-loan .ring,.lg-amtc::after{transition-duration:.01ms!important}
}

/* ---------- picker: verbatim from PICKER.md ---------- */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,0.85)}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div class="wrapc"><div class="phone-wrap" id="wrap"><div class="phone" id="phone">
  <div class="sbar" aria-hidden="true"><span>9:41</span><span>●●● 100%</span></div><div class="island" aria-hidden="true"></div>
  <div id="stage"></div>
  <nav class="tabbar" aria-label="Main" id="tabs"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div></div></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Ledger</button>
  <button class="proto-picker-item">Wallet</button>
  <button class="proto-picker-item">Countdown</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=n=>'₱'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const P={bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/>',check:'<path d="M5 12l5 5 9-10"/>',home:'<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',activity:'<path d="M4 12h4l3-7 3 14 3-7h3"/>',tag:'<path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="8.5" r="1.2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/>',wallet:'<path d="M4 7a2 2 0 0 1 2-2h12v4"/><path d="M4 7v10a2 2 0 0 0 2 2h14V9H6a2 2 0 0 1-2-2z"/><circle cx="16" cy="14" r="1"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .8 3.2 2.6 3.6 5.2"/>',card:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18"/>',list:'<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',plus:'<path d="M12 5v14M5 12h14"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',down:'<path d="M12 5v14M6 13l6 6 6-6"/>'};
const ic=(n,s=22,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const badge=z=>`<span class="cb" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.42)}px" aria-hidden="true">BM</span>`;

/* ---------- sample data (matches the app) ---------- */
let S;
function fresh(){return{sav:12480.5,sc:5000,
  dues:[{id:'sal',loan:'Salary Loan',amt:4250,mon:'NOV',day:3,date:'Nov 3',in:10,n:'Payment 15 of 24',paid:false},
        {id:'em',loan:'Emergency Loan',amt:1000,mon:'NOV',day:8,date:'Nov 8',in:15,n:'Payment 3 of 6',paid:false}],
  loans:{sal:{n:'Salary Loan',bal:38500,prin:90000,done:14,term:24},em:{n:'Emergency Loan',bal:3000,prin:6000,done:2,term:6}}}}
const open=()=>S.dues.filter(d=>!d.paid);
const pct=l=>Math.round((l.prin-l.bal)/l.prin*100);
function settle(d){d.paid=true;const l=S.loans[d.id];l.bal-=d.amt;l.done++}
let tt;function toast(m){const t=$('#toast');t.innerHTML=ic('check',18,2.2)+'<span>'+m+'</span>';t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function busy(btn,ms,then){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Paying…';setTimeout(then,ms)}
$('#tabs').innerHTML=[['home','Home'],['activity','Activity'],['tag','Offers'],['user','Me']].map((t,i)=>`<button class="tab${i?'':' on'}" ${i?'':'aria-current="page"'}>${ic(t[0])}${t[1]}</button>`).join('');
$('#tabs').addEventListener('click',e=>{if(e.target.closest('.tab:not(.on)'))toast('Only Home is part of this comparison')});

/* =========================================================
   1 · LEDGER
   ========================================================= */
const odoHTML=str=>`<span class="sr">${str}</span><span class="odo" aria-hidden="true">${[...str].map(ch=>/\d/.test(ch)?`<span class="od"><span class="ods" style="transform:translateY(${-ch*10}%)">${'0123456789'.split('').map(d=>'<span>'+d+'</span>').join('')}</span></span>`:'<span>'+ch+'</span>').join('')}</span>`;
function odoSet(el,str){const shape=s=>s.replace(/\d/g,'#');const cur=$('.sr',el).textContent;
  if(shape(cur)!==shape(str)){el.innerHTML=odoHTML(str);el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap');return}
  $('.sr',el).textContent=str;let k=0;[...str].forEach((ch,i)=>{if(/\d/.test(ch)){const s=$$('.ods',el)[k++];s.style.transitionDelay=(i*25)+'ms';s.style.transform=`translateY(${-ch*10}%)`}})}
function lgHead(){const o=open(),tot=o.reduce((t,d)=>t+d.amt,0);
  return o.length?`<p class="lg-lbl">Due in the next 15 days</p><div class="lg-amt" id="lg-amt">${odoHTML(fmt(tot))}</div><p class="lg-sub" id="lg-sub">${o.length} payment${o.length>1?'s':''} · next ${o[0].date}, in ${o[0].in} days</p><button class="btn dark" data-act="lgPayAll" id="lg-btn">Pay ${fmt(tot)}</button>`
  :`<p class="lg-lbl">Regular savings</p><div class="lg-amt">${odoHTML(fmt(S.sav))}</div><p class="lg-sub">Nothing due until Dec 3 · earns 2% a year</p><button class="btn ghost" data-act="toast" data-arg="Add money opens GCash">${ic('plus',20,2)} Add money</button>`}
const lgDue=d=>`<div class="lg-row${d.paid?' paid':''}" id="lg-${d.id}"><span class="lg-date"><i>${d.mon}</i><b>${d.day}</b></span><span class="rm"><b>${d.loan}</b><small>${d.n} · in ${d.in} days</small></span><span class="rv"><b class="lg-amtc">${fmt(d.amt)}</b><span class="lg-st">${d.paid?`<span class="lg-done">${ic('check',14,2.6)} Paid</span>`:`<button class="lg-pay" data-act="lgPay" data-arg="${d.id}">Pay</button>`}</span></span></div>`;
const lgLoan=(id)=>{const l=S.loans[id];return `<div class="lg-row" id="lgl-${id}"><span class="tile">${ic('card',18)}</span><span class="rm"><b>${l.n}</b><small class="lgl-n">${l.done} of ${l.term} paid · ${pct(l)}%</small><div class="bar"><i style="transform:scaleX(${pct(l)/100})"></i></div></span><span class="rv"><b class="lgl-b">${fmt(l.bal)}</b><small>left</small></span></div>`};
function ledger(){return `<div class="scroll">
  <header class="lg-top in" style="--i:0"><span class="lg-co">${badge(22)} Bayanihan MPC</span><button class="icb" data-act="toast" data-arg="2 reminders · Nov 3 and Nov 8" aria-label="Notifications">${ic('bell',20)}<i></i></button></header>
  <section class="lg-head in" style="--i:1" id="lg-head">${lgHead()}</section>
  <h2 class="lg-sec in" style="--i:2">Upcoming</h2><div class="group in" style="--i:2">${S.dues.map(lgDue).join('')}</div>
  <h2 class="lg-sec in" style="--i:3">Balances</h2><div class="group in" style="--i:3">
    <div class="lg-row"><span class="tile" style="background:var(--salmon);color:var(--ink)">${ic('wallet',18)}</span><span class="rm"><b>Regular savings</b><small>2% a year</small></span><span class="rv"><b>${fmt(S.sav)}</b></span></div>
    <div class="lg-row"><span class="tile">${ic('users',18)}</span><span class="rm"><b>Share capital</b><small>50 shares · fully paid</small></span><span class="rv"><b>${fmt(S.sc)}</b></span></div>
    ${lgLoan('sal')}${lgLoan('em')}</div>
  <h2 class="lg-sec in" style="--i:4">Recent</h2><div class="group in" style="--i:4">
    <div class="lg-row"><span class="tile">${ic('up',18)}</span><span class="rm"><b>Loan payment</b><small>Salary Loan · GCash · Oct 3</small></span><span class="rv"><b>−₱4,250.00</b></span></div>
    <div class="lg-row"><span class="tile">${ic('up',18)}</span><span class="rm"><b>Loan payment</b><small>Emergency Loan · bank · Oct 3</small></span><span class="rv"><b>−₱1,000.00</b></span></div>
    <div class="lg-row"><span class="tile" style="background:var(--sun);color:var(--ink)">${ic('down',18)}</span><span class="rm"><b>Interest credited</b><small>Regular savings · Sep 30</small></span><span class="rv"><b>+₱61.20</b></span></div></div>
</div>`}
function lgMark(d){settle(d);const r=$('#lg-'+d.id);r.classList.add('paid');$('.lg-st',r).innerHTML=`<span class="lg-done swap">${ic('check',14,2.6)} Paid</span>`;
  const l=S.loans[d.id],lr=$('#lgl-'+d.id);$('.lgl-b',lr).textContent=fmt(l.bal);$('.lgl-n',lr).textContent=`${l.done} of ${l.term} paid · ${pct(l)}%`;$('.bar i',lr).style.transform=`scaleX(${pct(l)/100})`;
  const o=open(),tot=o.reduce((t,x)=>t+x.amt,0);
  if(!o.length){setTimeout(()=>{const h=$('#lg-head');h.innerHTML=lgHead();h.classList.remove('in');h.classList.remove('swap');void h.offsetWidth;h.classList.add('swap')},450);return}
  odoSet($('#lg-amt'),fmt(tot));$('#lg-sub').textContent=`1 payment · next ${o[0].date}, in ${o[0].in} days`;const b=$('#lg-btn');b.disabled=false;b.textContent='Pay '+fmt(tot)}

/* =========================================================
   2 · WALLET
   ========================================================= */
let order=[];
function wlCards(){return [...open().map((d,i)=>({k:d.id,cls:i?'due2':'due',html:`<div class="k"><span>Due ${d.date}</span><span class="chip">in ${d.in} days</span></div><div class="amt">${fmt(d.amt)}</div><div class="lbl">${d.loan} · ${d.n.toLowerCase()}</div><div class="act"><small>Bayanihan MPC</small><button class="btn dark" data-act="wlPay" data-arg="${d.id}">Pay now</button></div>`})),
  {k:'sav',cls:'sav',html:`<div class="k"><span>Regular savings</span><span class="chip">2% a year</span></div><div class="amt">${fmt(S.sav)}</div><div class="lbl">Withdraw any time · interest Sep 30</div><div class="act"><small>Bayanihan MPC</small><button class="btn lime" data-act="toast" data-arg="Add money opens GCash">Add money</button></div>`},
  {k:'sc',cls:'sc',html:`<div class="k"><span>Share capital</span><span class="chip">Fully paid</span></div><div class="amt">${fmt(S.sc)}</div><div class="lbl">50 shares at ₱100 · earns dividends</div><div class="act"><small>Member since 2019</small><button class="btn ghost" data-act="toast" data-arg="Membership record opens">Record</button></div>`}]}
function wlLayout(){order.forEach((k,i)=>{const c=$(`.wl-card[data-k="${k}"]`);if(!c)return;c.style.zIndex=10-i;c.style.transform=`translateY(${i*14}px) scale(${1-i*.05})`;c.style.opacity=i>2?0:1;c.setAttribute('aria-hidden',i?'true':'false');$$('button',c).forEach(b=>b.tabIndex=i?-1:0)});
  const ks=wlCards().map(c=>c.k);$$('.wl-dots i').forEach((d,i)=>d.classList.toggle('on',ks[i]===order[0]))}
const ringSVG=(p,id)=>{const C=2*Math.PI*24;return `<div class="ringc"><svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--blush)" stroke-width="6"/><circle class="ring" id="${id}" cx="28" cy="28" r="24" fill="none" stroke="var(--coral)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}" transform="rotate(-90 28 28)"/></svg><span id="${id}-t">${p}%</span></div>`};
function wallet(){const cs=wlCards();order=cs.map(c=>c.k);
  return `<div class="scroll">
  <header class="wl-top in" style="--i:0"><div><small>${badge(18)} Bayanihan MPC</small><div class="h" style="font-size:26px;margin-top:4px">Hi, Ana</div></div><button class="icb" data-act="toast" data-arg="2 reminders · Nov 3 and Nov 8" aria-label="Notifications">${ic('bell',20)}<i></i></button></header>
  <div class="wl-stack in" style="--i:1" id="wl-stack" aria-roledescription="card stack">${cs.map(c=>`<article class="wl-card ${c.cls}" data-k="${c.k}">${c.html}</article>`).join('')}</div>
  <div class="wl-dots in" style="--i:1" aria-hidden="true">${cs.map(()=>'<i></i>').join('')}</div>
  <p class="wl-hint in" style="--i:2">Swipe the card to see the next one</p>
  <nav class="wl-qa in" style="--i:2" aria-label="Quick actions">
    <button data-act="wlNext"><span>${ic('card',22)}</span>Next card</button>
    <button data-act="toast" data-arg="Add money opens GCash"><span>${ic('plus',22)}</span>Add money</button>
    <button data-act="toast" data-arg="Statement sent to ana@example.com"><span>${ic('list',22)}</span>Statement</button>
    <button data-act="toast" data-arg="A collections officer will call you today"><span>${ic('help',22)}</span>Get help</button></nav>
  <h2 class="wl-sec in" style="--i:3">Your loans</h2>
  <div class="wl-loans in" style="--i:3">${['sal','em'].map(id=>{const l=S.loans[id];return `<div class="wl-loan">${ringSVG(pct(l),'wr-'+id)}<b>${l.n}</b><small id="wb-${id}">${fmt(l.bal)} left · ${l.done}/${l.term}</small></div>`}).join('')}</div>
</div>`}
function wlCycle(dir){const k=order[0],c=$(`.wl-card[data-k="${k}"]`);if(!c||order.length<2)return;
  c.style.transition='';c.style.transform=`translateX(${dir*115}%) rotate(${dir*9}deg)`;c.style.opacity=0;
  setTimeout(()=>{order.push(order.shift());c.style.transition='none';wlLayout();c.style.opacity=0;void c.offsetWidth;c.style.transition='';c.style.opacity=order.indexOf(k)>2?0:1},260)}
function wlInit(){const st=$('#wl-stack');if(!st)return;wlLayout();
  let drag=null;
  st.addEventListener('pointerdown',e=>{const c=e.target.closest('.wl-card');if(!c||c.dataset.k!==order[0]||e.target.closest('button'))return;drag={c,x:e.clientX,t:Date.now(),dx:0,k:$('#phone').getBoundingClientRect().width/390}});
  st.addEventListener('pointermove',e=>{if(!drag)return;drag.dx=(e.clientX-drag.x)/drag.k;if(Math.abs(drag.dx)<5&&!drag.c.classList.contains('drag'))return;
    if(!drag.c.classList.contains('drag')){drag.c.classList.add('drag');drag.c.setPointerCapture(e.pointerId)}
    drag.c.style.transform=`translateX(${drag.dx}px) rotate(${drag.dx*.04}deg)`});
  const end=()=>{if(!drag)return;const {c,dx,t}=drag;drag=null;if(!c.classList.contains('drag'))return;c.classList.remove('drag');
    const v=Math.abs(dx)/Math.max(1,Date.now()-t);if(Math.abs(dx)>110||(Math.abs(dx)>24&&v>.11))wlCycle(dx<0?-1:1);else wlLayout()};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  $('.wl-dots').setAttribute('aria-hidden','true');}
function wlPaid(id){const d=S.dues.find(x=>x.id===id);settle(d);const c=$(`.wl-card[data-k="${id}"]`);
  c.insertAdjacentHTML('beforeend',`<span class="wl-stamp">${ic('check',30,2.6)}</span>`);
  setTimeout(()=>{c.classList.add('gone');c.style.transform='translateY(70%) scale(.92)';
    setTimeout(()=>{c.remove();order=order.filter(k=>k!==id);const ks=wlCards().map(x=>x.k);$('.wl-dots').innerHTML=ks.map(()=>'<i></i>').join('');wlLayout();
      const l=S.loans[id],C=2*Math.PI*24;$('#wr-'+id).style.strokeDashoffset=C*(1-pct(l)/100);$('#wr-'+id+'-t').textContent=pct(l)+'%';$('#wb-'+id).textContent=`${fmt(l.bal)} left · ${l.done}/${l.term}`},320)},520)}

/* =========================================================
   3 · COUNTDOWN
   ========================================================= */
const R=84,CIRC=2*Math.PI*R;let sel='sal';
const frac=d=>Math.min(1,Math.max(.04,(30-d.in)/30));
function cdMid(){const o=open();if(!o.length)return `<span class="cd-num small swap">${fmt(S.sav)}</span><span class="cd-unit">in regular savings</span>`;
  const d=S.dues.find(x=>x.id===sel);return `<span class="cd-num swap">${d.in}</span><span class="cd-unit">days to ${d.date}</span>`}
function cdHero(){const o=open(),d=S.dues.find(x=>x.id===sel);
  return `<div class="cd-ring"><svg width="196" height="196" viewBox="0 0 196 196"><circle cx="98" cy="98" r="${R}" fill="none" stroke="rgba(25,28,21,.12)" stroke-width="12"/><circle class="prog" id="cd-prog" cx="98" cy="98" r="${R}" fill="none" stroke="var(--ink)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC*(1-(o.length?frac(d):1))}"/></svg><div class="cd-mid" id="cd-mid">${cdMid()}</div></div>
  <p class="cd-what" id="cd-what">${o.length?`${fmt(d.amt)} · ${d.loan}`:'Nothing due until Dec 3'}</p>
  ${o.length?`<button class="btn dark" id="cd-btn" data-act="cdPay">Pay ${fmt(d.amt)}</button>`:`<button class="btn dark" data-act="toast" data-arg="Add money opens GCash">Add money</button>`}`}
const tlDue=d=>`<li class="${d.paid?'ok':''}" id="tl-${d.id}"><span class="dot">${ic('check',12,3)}</span><button class="item${sel===d.id&&!d.paid?' sel':''}" data-act="cdSel" data-arg="${d.id}" aria-pressed="${sel===d.id}"><span class="rm"><b>${d.loan}</b><small>${d.date} · in ${d.in} days</small></span><span class="rv">${fmt(d.amt)}</span></button></li>`;
function countdown(){sel='sal';return `<div class="scroll">
  <header class="cd-top in" style="--i:0"><div><small>Saturday, Oct 24 · Bayanihan MPC</small><div class="h" style="font-size:26px;margin-top:4px">Hi, Ana</div></div><button class="icb" data-act="toast" data-arg="2 reminders · Nov 3 and Nov 8" aria-label="Notifications">${ic('bell',20)}<i></i></button></header>
  <section class="cd-hero in" style="--i:1" id="cd-hero">${cdHero()}</section>
  <h2 class="cd-sec in" style="--i:2">Timeline</h2>
  <ol class="tl in" style="--i:2" id="tl">
    <li class="past"><span class="dot"></span><div class="item"><span class="rm"><b>Paid both loans</b><small>Oct 3 · on time</small></span><span class="rv">${fmt(5250)}</span></div></li>
    <li class="now"><span class="dot"></span><div class="item"><span class="rm"><b>Today</b><small>Oct 24</small></span></div></li>
    ${S.dues.map(tlDue).join('')}
    <li class="later"><span class="dot"></span><div class="item"><span class="rm"><b>Salary Loan</b><small>Dec 3 · in 40 days</small></span><span class="rv">${fmt(4250)}</span></div></li></ol>
  <h2 class="cd-sec in" style="--i:3">Balances</h2>
  <div class="cd-bal in" style="--i:3"><div><small>Regular savings</small><b>${fmt(S.sav)}</b></div><div><small>Share capital</small><b>${fmt(S.sc)}</b></div><div><small>Salary Loan left</small><b id="cdb-sal">${fmt(S.loans.sal.bal)}</b></div><div><small>Emergency Loan left</small><b id="cdb-em">${fmt(S.loans.em.bal)}</b></div></div>
</div>`}
function cdSelect(id){sel=id;const d=S.dues.find(x=>x.id===id);$$('#tl .item[data-arg]').forEach(b=>{const on=b.dataset.arg===id&&!S.dues.find(x=>x.id===b.dataset.arg).paid;b.classList.toggle('sel',on);b.setAttribute('aria-pressed',on)});
  $('#cd-prog').style.strokeDashoffset=CIRC*(1-frac(d));$('#cd-mid').innerHTML=cdMid();$('#cd-what').textContent=`${fmt(d.amt)} · ${d.loan}`;const b=$('#cd-btn');b.disabled=false;b.textContent='Pay '+fmt(d.amt)}
function cdPaid(){const d=S.dues.find(x=>x.id===sel);settle(d);$('#cd-prog').style.strokeDashoffset=0;$('#cd-mid').innerHTML=`<span class="cd-check">${ic('check',34,2.6)}</span><span class="cd-unit" style="margin-top:10px">Paid ${d.date}</span>`;
  const li=$('#tl-'+d.id);li.className='ok';$('.item',li).classList.remove('sel');$('#cdb-'+d.id).textContent=fmt(S.loans[d.id].bal);$('#cd-btn').innerHTML='Paid';
  setTimeout(()=>{const o=open();if(o.length)cdSelect(o[0].id);else{const h=$('#cd-hero');h.innerHTML=cdHero();h.classList.remove('in','swap');void h.offsetWidth;h.classList.add('swap')}},1000)}

/* ---------- actions ---------- */
const ACT={
  toast:(el,a)=>toast(a),
  lgPay:(el,id)=>{el.disabled=true;el.innerHTML='<span class="spin" style="width:12px;height:12px;border-width:2px"></span>';setTimeout(()=>lgMark(S.dues.find(d=>d.id===id)),700)},
  lgPayAll:el=>busy(el,800,()=>{const o=open();o.forEach((d,i)=>setTimeout(()=>lgMark(d),i*350));toast('Payment sent · '+fmt(o.reduce((t,d)=>t+d.amt,0)))}),
  wlPay:(el,id)=>busy(el,700,()=>{wlPaid(id);toast('Payment sent · '+fmt(S.dues.find(d=>d.id===id).amt))}),
  wlNext:()=>wlCycle(-1),
  cdSel:(el,id)=>{if(!S.dues.find(d=>d.id===id).paid)cdSelect(id)},
  cdPay:el=>busy(el,700,()=>{const d=S.dues.find(x=>x.id===sel);cdPaid();toast('Payment sent · '+fmt(d.amt))})};
$('#stage').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.disabled)ACT[el.dataset.act](el,el.dataset.arg)});

/* ---------- variants + picker wiring (PICKER.md reference) ---------- */
const variants=[()=>{S=fresh();return ledger()},()=>{S=fresh();return wallet()},()=>{S=fresh();return countdown()}];
const after=[()=>{},wlInit,()=>{}];
const stage=document.getElementById('stage');
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay=picker.querySelector('.proto-picker-replay');
let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function mount(i){stage.innerHTML='';requestAnimationFrame(()=>{stage.innerHTML=variants[i]();after[i]()})}
function setActive(i){if(i<0||i>=variants.length)return;current=i;
  items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});
  moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
replay?.addEventListener('click',()=>mount(current));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const num=parseInt(e.key,10);
  if(num>=1&&num<=variants.length)setActive(num-1);
  else if(e.key==='ArrowRight')setActive((current+1)%variants.length);
  else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);
  else if(e.key==='r'||e.key==='R')mount(current)});

/* phone scaling, same rule as the app (leaves room for the picker) */
function fit(){const s=Math.max(.4,Math.min(1,(innerHeight-130)/844,(innerWidth-32)/390));const w=$('#wrap');w.style.width=390*s+'px';w.style.height=844*s+'px';$('#phone').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();

setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
