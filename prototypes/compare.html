<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fundo Home Compare</title>
<style>
:root{--s:.8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#ECEFE3;color:#191C15;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.row{display:flex;gap:40px;overflow-x:auto;padding:28px 32px 36px;align-items:flex-start}
/* centre when it fits, scroll from the left edge when it doesn't */
.row::before,.row::after{content:"";margin:auto}
.col{flex-shrink:0;display:flex;flex-direction:column;gap:14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;padding:0 4px}
.hd b{font-weight:600}
.hd small{display:block;font-size:12.5px;color:#5A6352;margin-top:2px}
.hd a{font-size:13px;font-weight:600;color:#4C6A0C;text-decoration:none;white-space:nowrap}
.hd a:hover{text-decoration:underline}
.tag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:6px;background:#191C15;color:#F7FAEE;font-size:11px;font-weight:600;vertical-align:1px}
.dev{width:calc(390px*var(--s));height:calc(844px*var(--s));border-radius:calc(46px*var(--s));overflow:hidden;background:#F7FAEE;box-shadow:0 0 0 calc(10px*var(--s)) #0E100C,0 0 0 calc(11px*var(--s)) #3A3F36,0 30px 60px -30px rgba(25,28,21,.45)}
.dev iframe{display:block;width:390px;height:844px;border:0;transform:scale(var(--s));transform-origin:0 0}
</style>
</head>
<body>
<main class="row">
  <section class="col"><div class="hd"><div><b>Current</b><span class="tag">Main</span><small>The Home screen in the app today</small></div><a href="../index.html#home">Open ↗</a></div><div class="dev"><iframe src="../index.html#home" title="Current Home screen"></iframe></div></section>
  <section class="col"><div class="hd"><div><b>1 · Ledger</b><small>Statement layout, rolling digits</small></div><a href="home.html?v=1">Open ↗</a></div><div class="dev"><iframe src="home.html?v=1&amp;solo" title="Ledger variant"></iframe></div></section>
  <section class="col"><div class="hd"><div><b>2 · Wallet</b><small>Card stack you flick through</small></div><a href="home.html?v=2">Open ↗</a></div><div class="dev"><iframe src="home.html?v=2&amp;solo" title="Wallet variant"></iframe></div></section>
  <section class="col"><div class="hd"><div><b>3 · Countdown</b><small>Days-to-due ring and timeline</small></div><a href="home.html?v=3">Open ↗</a></div><div class="dev"><iframe src="home.html?v=3&amp;solo" title="Countdown variant"></iframe></div></section>
</main>
<script>
// Phones keep their real 390×844 layout and are scaled as a whole, so spacing reads true.
function fit(){document.documentElement.style.setProperty('--s',Math.max(.45,Math.min(1,(innerHeight-130)/844)))}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
